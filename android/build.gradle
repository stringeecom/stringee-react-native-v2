buildscript {
    repositories {
        google()
        mavenCentral()
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            // Matches the RN Hello World template
            // https://github.com/facebook/react-native/blob/1e8f3b11027fe0a7514b4fc97d0798d3c64bc895/local-cli/templates/HelloWorld/android/build.gradle#L21
            url "$projectDir/../node_modules/react-native/android"
        }
    }

    dependencies {
        if (project == rootProject) {
            classpath("com.android.tools.build:gradle:8.13.0")
        }
    }
}

apply plugin: 'com.android.library'

if (project == rootProject) {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace "com.stringeereactnative"
    compileSdk rootProject.ext.has('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35

    defaultConfig {
        minSdkVersion rootProject.ext.has('minSdkVersion') ? rootProject.ext.minSdkVersion : 21
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        consumerProguardFiles 'proguard-rules.pro'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE.txt', 'META-INF/LICENSE', 'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/DEPENDENCIES.txt', 'META-INF/DEPENDENCIES']
        }
    }

    lintOptions {
        abortOnError true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    def standaloneReactNativeVersion = project.findProperty('reactNativeVersion') ?: '0.84.0'

    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    compileOnly(project == rootProject
            ? "com.facebook.react:react-android:${standaloneReactNativeVersion}"
            : 'com.facebook.react:react-native:+')
    implementation 'com.stringee.sdk.android:stringee-android-sdk:2.1.13'
//    implementation 'com.stringee.sdk.android:stringee-android-sdk-dev:2.1.13'
    implementation 'io.github.webrtc-sdk:android:144.7559.09'
}
